[package]
name = "enhannce-rs"
version = "0.1.0"
edition = "2024"
description = "A pure Rust CLI tool for image upscaling using neural networks"

[dependencies]
# Neural network inference - Pure Rust
candle-core = { version="0.10" }
candle-nn = { version="0.10" }
candle-metal-kernels = { version="0.10", optional = true }

# Image processing
image = "0.25"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"
safetensors = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-metal-kernels"]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
